server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml text/plain application/manifest+json;
    gzip_min_length 1024;

    # Static export writes hashed bundles under /_next/static: cache forever.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # The wasm module and its JS glue are not content-hashed: revalidate.
    location /pkg/ {
        types { application/wasm wasm; application/javascript js; }
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Pages (route/index.html), icons, manifest: revalidate on each load so a
    # new deploy is picked up immediately.
    #
    # CSP notes: Next.js emits inline hydration scripts, so script-src needs
    # 'unsafe-inline'; WebAssembly.instantiate needs 'wasm-unsafe-eval'; the
    # Have I Been Pwned range API is the only cross-origin request.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.pwnedpasswords.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        try_files $uri $uri/ =404;
    }
}
