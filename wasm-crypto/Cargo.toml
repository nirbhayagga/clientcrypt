[package]
name = "wasm-crypto"
version = "0.1.0"
edition = "2024"
description = "Cryptographic primitives for ClientCrypt, compiled to WebAssembly"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.2", features = ["js"] }
rand = { version = "0.8", features = ["getrandom"] }
hex = "0.4"

# Symmetric
aes = "0.8"

# Hashing / MACs
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"

# Public key
rsa = { version = "0.9", features = ["pem"] }
num-bigint = { version = "0.4", features = ["rand"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
