[package]
name = "wasm-crypto"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
sha2 = "0.10"
sha1 = "0.10"
aes = "0.8"
rsa = { version = "0.9", features = ["pem"] }
hmac = "0.12"
rand = { version = "0.8", features = ["getrandom"] }
getrandom = { version = "0.2", features = ["js"] }
num-bigint = { version = "0.4", features = ["rand"] }
hex = "0.4"

[dependencies.web-sys]
version = "0.3"
features = ["Window", "Performance"]
